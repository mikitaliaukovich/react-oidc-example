name: Deploy placeholder to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The app itself now ships as a desktop app (see release.yml). Pages only
      # serves a static placeholder that removes the old app's browser data.
      - name: Prepare placeholder site
        run: |
          mkdir site
          cp pages/index.html pages/cleanup.js site/
          cp pages/index.html site/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy placeholder to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
